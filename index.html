<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c12"><title>Starling — 함께 나누는 대화</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#090b11;--panel:#10131c;--line:#ffffff12;--muted:#858b9e;--text:#edf0f8;--accent:#c9f27a;--blue:#9bb8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#1b23401c,transparent 45%),var(--bg);color:var(--text);font-family:Manrope,'Noto Sans KR',sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,760px) 1fr;max-width:1440px;margin:auto;padding:0 28px}.side{border-right:1px solid var(--line);padding:34px 22px 24px 0;display:flex;flex-direction:column}.logo{display:flex;gap:11px;align-items:center;font-weight:800;letter-spacing:.08em;font-size:16px}.logo-icon{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;color:#14200a;background:linear-gradient(145deg,#e0ffa4,#91c943);box-shadow:0 0 28px #b7ee6044;font-size:19px}.brand-sub{margin:28px 0 10px;color:#676e81;font:10px 'DM Mono',monospace;letter-spacing:.18em}.room{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:12px;background:#c9f27a12;border:1px solid #c9f27a1c;color:#d6f5a5;font-size:13px}.room-dot,.live-dot{width:7px;height:7px;background:#b8eb68;border-radius:50%;box-shadow:0 0 11px #b8eb68}.side-note{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:14px;color:#81889b;font-size:11px;line-height:1.75}.side-note strong{display:block;color:#c9d0df;font-size:11px;margin-bottom:5px}.main{min-height:100vh;max-height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);position:relative}.top{height:78px;flex:none;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0b0d14cc;backdrop-filter:blur(15px)}.room-title{font-size:14px;font-weight:700}.room-sub{font:10px 'DM Mono',monospace;color:#777f92;margin-top:4px;letter-spacing:.08em}.online{display:flex;align-items:center;gap:8px;font:10px 'DM Mono',monospace;letter-spacing:.08em;color:#a7b1c8;border:1px solid var(--line);border-radius:999px;padding:8px 11px}.messages{flex:1;overflow:auto;padding:26px 28px 22px;scrollbar-width:thin;scrollbar-color:#303747 transparent}.welcome{text-align:center;margin:18px auto 30px;max-width:380px;color:#82899c;font-size:12px;line-height:1.85}.welcome-mark{margin:0 auto 14px;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#c9f27a12;border:1px solid #c9f27a25;color:var(--accent);font-size:21px}.welcome strong{color:#c9f27a;font-weight:600}.day{text-align:center;margin:24px auto;color:#636c80;font:9px 'DM Mono',monospace;letter-spacing:.13em}.message{display:flex;gap:11px;margin:18px 0;animation:appear .22s ease-out}.avatar{width:31px;height:31px;flex:none;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#34405a,#1e2535);color:#dbe5ff;font-size:12px;font-weight:700}.content{min-width:0}.meta{display:flex;align-items:baseline;gap:9px;margin:0 0 6px}.name{font-size:11px;font-weight:700;color:#cdd4e5}.time{color:#687084;font:9px 'DM Mono',monospace}.bubble{max-width:min(100%,520px);padding:10px 13px;border:1px solid #ffffff0e;border-radius:3px 13px 13px 13px;background:#151923;color:#d8ddeb;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.message.mine .avatar{background:linear-gradient(145deg,#d7f996,#a7d85c);color:#202a12}.message.mine .name{color:#d7f3a7}.message.mine .bubble{background:#c9f27a12;border-color:#c9f27a25}.message.mine{flex-direction:row-reverse}.message.mine .content{text-align:right}.message.mine .meta{justify-content:flex-end}.message.mine .bubble{border-radius:13px 3px 13px 13px;text-align:left}.composer-wrap{padding:14px 28px 23px;background:linear-gradient(transparent,#0b0d14 18%)}.composer{display:flex;align-items:flex-end;gap:10px;padding:9px 10px 9px 16px;background:#141720;border:1px solid #ffffff18;border-radius:15px;transition:border .2s,box-shadow .2s}.composer:focus-within{border-color:#c9f27a70;box-shadow:0 0 0 3px #c9f27a0b}.composer textarea{resize:none;max-height:130px;min-height:24px;flex:1;border:0;outline:0;background:transparent;color:#eef1f7;font:13px/1.7 'Noto Sans KR',sans-serif;padding:2px 0}.composer textarea::placeholder{color:#697184}.send{height:37px;min-width:43px;border:0;border-radius:11px;background:var(--accent);color:#17200e;font-size:17px;cursor:pointer;transition:transform .16s,filter .16s}.send:hover{transform:translateY(-1px);filter:brightness(1.08)}.send:disabled{opacity:.45;cursor:default}.hint{margin:8px 3px 0;color:#60687a;font-size:9px}.right{padding:36px 0 0 25px}.profile-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#10131c}.profile-label{font:9px 'DM Mono',monospace;color:#697286;letter-spacing:.17em;margin-bottom:14px}.input-label{display:block;font-size:10px;color:#9aa2b3;margin-bottom:7px}.nickname{width:100%;border:1px solid #ffffff16;border-radius:9px;background:#0b0e15;color:#e9edf6;font:12px 'Noto Sans KR',sans-serif;outline:0;padding:10px}.nickname:focus{border-color:#c9f27a66}.profile-help{margin-top:9px;color:#6f778a;font-size:9px;line-height:1.7}.connection{margin-top:14px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-size:10px;color:#a1aabd;line-height:1.7}.connection .live-dot{display:inline-block;margin-right:7px}.connection.offline{color:#ffb0a6}.connection.offline .live-dot{background:#ff806e;box-shadow:0 0 10px #ff806e}.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:.2s;padding:9px 14px;border:1px solid #ffffff20;border-radius:999px;background:#191e29;color:#dce3f0;font-size:11px}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:950px){.shell{grid-template-columns:210px minmax(0,1fr);padding:0 18px}.right{display:none}.side{padding-right:15px}.main{border-right:0}}
@media(max-width:600px){.shell{display:block;padding:0}.side{display:none}.main{height:100dvh;min-height:0;max-height:100dvh}.top{height:66px;padding:0 17px}.messages{padding:18px 16px}.composer-wrap{padding:10px 13px calc(12px + env(safe-area-inset-bottom))}.welcome{margin:10px auto 26px}.online{font-size:9px;padding:7px 9px}}
</style></head><body>
<div class="shell"><aside class="side"><div class="logo"><span class="logo-icon">✳</span> STARLING</div><div class="brand-sub">YOUR LITTLE CORNER</div><div class="room"><span class="room-dot"></span><span># 별빛 라운지</span></div><div class="side-note"><strong>가볍게 인사해요 ✦</strong>이곳에 접속한 사람 누구나 함께 이야기할 수 있어요. 닉네임을 정하고 첫 메시지를 보내 보세요.</div></aside>
<main class="main"><header class="top"><div><div class="room-title">별빛 라운지</div><div class="room-sub">ONE ROOM · OPEN TO EVERYONE</div></div><div class="online"><span class="live-dot" id="statusDot"></span><span id="statusText">연결 중</span></div></header>
<section class="messages" id="messages"><div class="welcome" id="welcome"><div class="welcome-mark">✳</div><strong>별빛 라운지</strong>에 오신 걸 환영해요.<br>지금 접속한 사람들과 편하게 이야기 나눠 보세요.</div></section>
<div class="composer-wrap"><form class="composer" id="form"><textarea id="text" rows="1" maxlength="500" placeholder="메시지를 입력하세요…" aria-label="메시지"></textarea><button class="send" id="send" aria-label="보내기">↑</button></form><div class="hint">Enter로 전송 · Shift + Enter로 줄 바꿈</div></div><div class="toast" id="toast"></div></main>
<aside class="right"><div class="profile-card"><div class="profile-label">YOUR PROFILE</div><label class="input-label" for="nickname">채팅 닉네임</label><input class="nickname" id="nickname" maxlength="24" value="" placeholder="이름을 입력해 주세요"><div class="profile-help">닉네임은 이 브라우저에 저장돼요.<br>개인정보는 입력하지 마세요.</div></div><div class="connection" id="connection"><span class="live-dot"></span>서버와 연결해 대화를 동기화합니다.</div></aside></div>
<script>
(()=>{const $=s=>document.querySelector(s),list=$('#messages'),form=$('#form'),input=$('#text'),nick=$('#nickname'),toastEl=$('#toast');nick.value=localStorage.getItem('starling-name')||'';let seen=new Set(),toastTimer;function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600)}function addMessage(m){if(seen.has(m.id))return;seen.add(m.id);$('#welcome')?.remove();const mine=m.name===nick.value.trim(),row=document.createElement('article');row.className='message'+(mine?' mine':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(m.name[0]||'?').toUpperCase();const content=document.createElement('div');content.className='content';const meta=document.createElement('div');meta.className='meta';const name=document.createElement('span');name.className='name';name.textContent=m.name;const time=document.createElement('time');time.className='time';time.textContent=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(m.time));meta.append(name,time);const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;content.append(meta,bubble);row.append(avatar,content);list.append(row);list.scrollTop=list.scrollHeight}function connect(){const es=new EventSource('/events');es.addEventListener('open',()=>{$('#statusText').textContent='실시간 연결됨';$('#connection').classList.remove('offline')});es.addEventListener('error',()=>{$('#statusText').textContent='재연결 중';$('#connection').classList.add('offline')});es.addEventListener('history',e=>{for(const m of JSON.parse(e.data))addMessage(m)});es.addEventListener('message',e=>addMessage(JSON.parse(e.data)))}connect();nick.addEventListener('change',()=>localStorage.setItem('starling-name',nick.value.trim()));input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});form.addEventListener('submit',async e=>{e.preventDefault();const name=nick.value.trim(),text=input.value.trim();if(!name){toast('먼저 오른쪽에서 닉네임을 정해 주세요.');nick.focus();return}if(!text)return;localStorage.setItem('starling-name',name);$('#send').disabled=true;try{const r=await fetch('/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,text})});if(!r.ok)throw Error();input.value='';input.style.height='auto';input.focus()}catch{toast('서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.')}finally{$('#send').disabled=false}})})();
</script></body></html>
