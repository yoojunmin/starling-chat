</header>
<section class="side-card"><div class="eyebrow">FOREST JOURNAL · 01</div><div class="quest-title">빛의 조각을 찾아서</div><div class="quest-copy">숲 곳곳의 빛나는 장소에 다가가<br>손을 뻗어 보세요.</div><div class="shards"><span class="shard-icon">✧</span><span>빛의 조각</span><strong id="shardCount">0</strong></div></section>

<div class="modal-backdrop" id="customModal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div class="modal-title" id="modalTitle">나만의 숲 여행자</div><div class="modal-sub">모습을 고르고, 이 세계에 이름을 남겨 보세요.</div></div><button class="close" id="modalClose" aria-label="닫기">×</button></div><div class="custom-layout"><div class="preview-card"><canvas id="preview" width="300" height="420"></canvas><div class="preview-name" id="previewName">WANDERER</div></div><div><input class="name-input" id="characterName" maxlength="16" placeholder="숲에서 사용할 이름"><div class="options" id="options"></div></div></div><div class="modal-foot"><button class="glass-button" id="randomizeBtn">✧ 무작위</button><button class="glass-button primary" id="saveBtn">이 모습으로 떠나기</button></div></section></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),preview=document.querySelector('#preview'),pctx=preview.getContext('2d');
const WORLD={w:3600,h:2600},$=s=>document.querySelector(s),TAU=Math.PI*2;
const choices={

 hair:{label:'머리 모양',items:[['bob','단발'],['long','긴 머리'],['twin','양갈래'],['curl','곱슬'],['pixie','숏컷'],['braid','땋은 머리'],['bun','올림머리']]},
 hairColor:{label:'머리색',items:[['ink','먹빛','#26332e'],['chestnut','밤색','#80513d'],['honey','꿀빛','#e3b65d'],['silver','은빛','#d4ded1'],['rose','장밋빛','#d8798c'],['teal','청록','#53b8a5'],['lilac','보랏빛','#9f83d0'],['moss','이끼빛','#8da756']]},

 feature:{label:'특징 · 장신구',items:[['none','없음'],['horns','작은 뿔'],['antlers','사슴뿔'],['ribbon','리본'],['flower','꽃 화관'],['leaf','잎사귀 핀'],['halo','빛의 고리'],['glasses','둥근 안경']]}
};

let id=localStorage.getItem('whisperwood-id');
if(!id){id=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));localStorage.setItem('whisperwood-id',id)}
const outfitColors={sage:['#64856d','#b3d695'],moon:['#7588b8','#d4d8f0'],traveler:['#bd8558','#e5c18a'],petal:['#bd7892','#f1c3c9'],starlit:['#4d5f91','#c4d5f5'],moss:['#7c914a','#cad18a'],berry:['#a65d70','#e6a0a5']};
const skinColors=Object.fromEntries(choices.skin.items.map(([id,n,c])=>[id,c]));
const hairColors=Object.fromEntries(choices.hairColor.items.map(([id,n,c])=>[id,c]));
const eyeColors=Object.fromEntries(choices.eyeColor.items.map(([id,n,c])=>[id,c]));
let W=innerWidth,H=innerHeight,dpr=1,camera={x:WORLD.w/2,y:WORLD.h/2},player={x:WORLD.w/2,y:WORLD.h/2+190,vx:0,vy:0,facing:1};
let remote=new Map(),keys={},joy={x:0,y:0},socket=null,lastSend=0,lastFrame=0,shards=0,chatOpen=false,actionFx=[],ambient=[],collected=new Set(),worldObjects=[],trees=[],toastTimer;
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function trailY(x){return 1670-x*.075+Math.sin(x*.0032)*155}
function makeForest(){const r=rng(58229);trees=[];for(let i=0;i<390;i++){const x=35+r()*(WORLD.w-70),y=35+r()*(WORLD.h-70);if(Math.abs(y-trailY(x))<122)continue;if(Math.hypot(x-WORLD.w*.5,y-WORLD.h*.5)<310)continue;if(x>2450&&y<1600&&x<3000)continue;trees.push({x,y,size:24+r()*38,hue:r(),phase:r()*TAU})}worldObjects=[{id:'ancient',x:WORLD.w/2,y:WORLD.h/2-32,r:110,label:'오래된 수호목',kind:'tree'},{id:'spring',x:WORLD.w*.69,y:WORLD.h*.49,r:76,label:'달샘',kind:'spring'},{id:'shard-a',x:WORLD.w*.31,y:WORLD.h*.57,r:42,label:'빛의 조각',kind:'shard'},{id:'shard-b',x:WORLD.w*.78,y:WORLD.h*.68,r:42,label:'빛의 조각',kind:'shard'},{id:'shard-c',x:WORLD.w*.42,y:WORLD.h*.28,r:42,label:'빛의 조각',kind:'shard'},{id:'camp',x:WORLD.w*.58,y:WORLD.h*.72,r:70,label:'여행자의 모닥불',kind:'camp'}];ambient=Array.from({length:90},()=>({x:r()*WORLD.w,y:r()*WORLD.h,z:.35+r()*.65,phase:r()*TAU}))}

function showToast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function addChat(item,notice){const row=document.createElement('div');row.className='chat-line'+(notice?' notice':'');if(notice)row.textContent=item.text;else{const n=document.createElement('strong'),m=document.createElement('span');n.textContent=item.name+':';m.textContent=item.text;row.append(n,m)}$('#chatMessages').append(row);const box=$('#chatMessages');box.scrollTop=box.scrollHeight;while(box.children.length>45)box.firstChild.remove()}
function connect(){const protocol=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(protocol+'//'+location.host+'/?id='+encodeURIComponent(id)+'&name='+encodeURIComponent(name||'여행자'));socket.addEventListener('open',()=>{showToast('숲의 숨결이 연결되었어요');sendMove(true)});socket.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){id=m.id;localStorage.setItem('whisperwood-id',id);remote.clear();for(const p of m.players||[])remote.set(p.id,p);for(const item of m.chat||[])addChat(item,false);setCount()}else if(m.type==='players'){remote.clear();for(const p of m.players||[])remote.set(p.id,p);setCount()}else if(m.type==='chat'){addChat(m.item,false);if(!chatOpen)showToast(m.item.name+': '+m.item.text)}else if(m.type==='notice'){addChat({text:m.text},true);if(!chatOpen)showToast(m.text)}else if(m.type==='action'&&m.id!==id){const other=remote.get(m.id);if(other)actionFx.push({x:other.x,y:other.y,at:Date.now(),text:m.action,color:'#e7f3c0'})}});socket.addEventListener('close',()=>setTimeout(connect,1800));socket.addEventListener('error',()=>socket.close())}
function setCount(){$('#playerCount').textContent=remote.size+1}
function send(data){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(data))}
function sendMove(force){const now=performance.now();if(!force&&now-lastSend<85)return;lastSend=now;send({type:'move',x:player.x,y:player.y,name:name||'여행자',appearance:appearance,facing:player.facing})}
function movePlayer(dt){let x=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+joy.x,y=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+joy.y,len=Math.hypot(x,y);if(len>1){x/=len;y/=len}player.vx=(player.vx+x*700*dt)*Math.pow(.81,dt);player.vy=(player.vy+y*700*dt)*Math.pow(.81,dt);const speed=Math.hypot(player.vx,player.vy),max=230;if(speed>max){player.vx*=max/speed;player.vy*=max/speed}player.x=Math.max(32,Math.min(WORLD.w-32,player.x+player.vx*dt));player.y=Math.max(32,Math.min(WORLD.h-32,player.y+player.vy*dt));if(Math.abs(player.vx)>3)player.facing=player.vx<0?-1:1;if(Math.abs(x)+Math.abs(y)>.03)sendMove(false)}
function closestObject(){let best=null,distance=Infinity;for(const o of worldObjects){const d=Math.hypot(o.x-player.x,o.y-player.y);if(d<o.r+40&&d<distance){best=o;distance=d}}return best}
function interact(){const o=closestObject();if(!o){showToast('조금 더 가까이 다가가 보세요');return}let text;if(o.kind==='shard'){if(collected.has(o.id))text='이 빛의 조각은 이미 만났어요';else{collected.add(o.id);shards++;$('#shardCount').textContent=shards;text='빛의 조각을 발견했어요 ✧'}}else if(o.kind==='tree')text='오래된 나무가 당신의 이름을 기억합니다';else if(o.kind==='spring')text='달샘의 물결이 반짝입니다';else text='모닥불 곁에서 잠시 쉬어 갑니다';showToast(text);actionFx.push({x:player.x,y:player.y,at:Date.now(),text:o.kind==='shard'?'✧ +1':text,color:'#def3b7'});send({type:'action',action:text,target:o.id})}
function frame(now){const dt=Math.min(.04,(now-lastFrame)/1000||.016);lastFrame=now;movePlayer(dt);camera.x+=(player.x-camera.x)*Math.min(1,dt*5.2);camera.y+=(player.y-camera.y)*Math.min(1,dt*5.2);const t=now/1000;drawWorld(t);const o=closestObject(),prompt=$('#interactPrompt');if(o){prompt.textContent=(innerWidth<=760?'':'E　')+o.label+'　·　손을 뻗기';prompt.classList.add('show')}else prompt.classList.remove('show');actionFx=actionFx.filter(f=>Date.now()-f.at<2300);requestAnimationFrame(frame)}
function buildOptions(){const root=$('#options');root.innerHTML='';for(const [key,group] of Object.entries(choices)){const box=document.createElement('section');box.className='option-group';const label=document.createElement('div');label.className='group-label';label.textContent=group.label;const row=document.createElement('div');row.className='choices';for(const [value,title,color] of group.items){const b=document.createElement('button');b.type='button';b.className='choice'+(appearance[key]===value?' selected':'');b.textContent=title;if(color){b.classList.add('swatch');b.title=title;b.setAttribute('aria-label',title);b.style.background=color;b.textContent=''}b.addEventListener('click',()=>{appearance[key]=value;localStorage.setItem('whisperwood-look',JSON.stringify(appearance));buildOptions();drawPreview();sendMove(true)});row.append(b)}box.append(label,row);root.append(box)}$('#previewName').textContent=(name||'WANDERER').toUpperCase()}
function drawPreview(){pctx.clearRect(0,0,preview.width,preview.height);pctx.save();pctx.translate(preview.width/2,preview.height*.64);drawCharacter(pctx,0,0,{appearance:appearance},2.25,performance.now()/1000);pctx.restore()}
function openCustomize(){buildOptions();$('#characterName').value=name;drawPreview();$('#customModal').classList.add('open');if(!name)setTimeout(()=>$('#characterName').focus(),120)}
function closeCustomize(){const value=$('#characterName').value.trim();if(!value){showToast('숲에서 사용할 이름을 입력해 주세요');$('#characterName').focus();return}name=value.slice(0,16);localStorage.setItem('whisperwood-name',name);$('#previewName').textContent=name.toUpperCase();$('#customModal').classList.remove('open');sendMove(true)}
$('#customizeBtn').addEventListener('click',openCustomize);$('#modalClose').addEventListener('click',closeCustomize);$('#customModal').addEventListener('click',e=>{if(e.target.id==='customModal'&&name)closeCustomize()});$('#saveBtn').addEventListener('click',closeCustomize);$('#characterName').addEventListener('input',()=>{$('#previewName').textContent=($('#characterName').value||'WANDERER').toUpperCase()});$('#randomizeBtn').addEventListener('click',()=>{for(const key of Object.keys(choices)){const items=choices[key].items;appearance[key]=items[Math.floor(Math.random()*items.length)][0]}localStorage.setItem('whisperwood-look',JSON.stringify(appearance));buildOptions();drawPreview();sendMove(true)});
function toggleChat(force){chatOpen=force===undefined?!chatOpen:force;$('#chatPanel').classList.toggle('open',chatOpen)}$('#chatBtn').addEventListener('click',()=>toggleChat());$('#mobileChatBtn').addEventListener('click',()=>toggleChat());$('#chatClose').addEventListener('click',()=>toggleChat(false));$('#chatForm').addEventListener('submit',e=>{e.preventDefault();const input=$('#chatInput'),text=input.value.trim();if(!text)return;if(!name){showToast('먼저 캐릭터 이름을 정해 주세요');return}send({type:'chat',text:text});input.value=''});
$('#mobileAction').addEventListener('pointerdown',e=>{e.preventDefault();interact()});addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if((e.code==='KeyE'||e.code==='Space')&&!e.repeat)interact();if(e.code==='Escape'){if(name)closeCustomize();toggleChat(false)}});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};joy.x=joy.y=0});
const stick=$('#joystick'),knob=$('#joyKnob');let stickId=null;function updateJoy(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,lim=r.width*.34,len=Math.hypot(dx,dy),f=len>lim?lim/len:1;joy.x=dx*f/lim;joy.y=dy*f/lim;knob.style.transform='translate(calc(-50% + '+(dx*f)+'px),calc(-50% + '+(dy*f)+'px))'}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);updateJoy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)updateJoy(e)});function resetJoy(){stickId=null;joy.x=joy.y=0;knob.style.transform='translate(-50%,-50%)'}stick.addEventListener('pointerup',resetJoy);stick.addEventListener('pointercancel',resetJoy);
fit();connect();setInterval(()=>send({type:'heartbeat'}),30000);if(!name)openCustomize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
